<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact - Curious People</title>

  <link rel="icon" href="assets/Icons/favicon.svg" type="image/svg+xml">

  <style>
    :root {
      --bg: #dedede;
      --text: #171717;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;

      background: var(--bg);
      color: var(--text);

      font-family: Ubuntu, Helvetica, sans-serif;
      text-transform: lowercase;
    }

    header {
      position: fixed;
      left: 0;
      top: 10px;

      width: 100%;
      height: 70px;

      display: flex;
      align-items: center;

      padding: 0 22px;

      z-index: 5;
    }

    .menu-button,
    .close {
      appearance: none;

      border: 0;
      background: none;

      color: inherit;

      font: 700 11px/1 Ubuntu, Helvetica, sans-serif;

      cursor: pointer;
      text-transform: lowercase;

      padding: 10px 0;
    }

    main {
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 120px 24px 100px;
    }

    .contact-box {
      width: min(700px, 100%);
      text-align: center;
    }

    .contact-title {
      margin: 0 0 45px;

      font-size: clamp(32px, 5vw, 72px);
      font-weight: 900;

      letter-spacing: -0.04em;
      line-height: 1;
    }

    .contact-info {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.8;
    }

    .contact-info p {
      margin: 0 0 24px;
    }

    .contact-info a {
      color: inherit;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .contact-info a:hover {
      opacity: 0.55;
    }

    .contact-label {
      display: block;

      margin-bottom: 4px;

      font-size: 11px;
      font-weight: 700;
    }

    .bottom-left {
      position: fixed;

      left: 18px;
      bottom: 18px;

      font-size: 10px;
      font-weight: 700;

      z-index: 5;
    }

    .menu-panel {
      position: fixed;
      inset: 0;

      background: var(--bg);

      display: flex;
      align-items: center;

      padding: 10vw;

      transform: translateX(-100%);
      transition: transform 0.45s cubic-bezier(.77, 0, .18, 1);

      z-index: 20;
    }

    .menu-panel.open {
      transform: translateX(0);
    }

    .menu-panel nav {
      display: flex;
      flex-direction: column;

      gap: 18px;
    }

    .menu-panel a {
      color: var(--text);
      text-decoration: none;

      font-size: clamp(32px, 5vw, 72px);
      font-weight: 900;

      letter-spacing: -0.04em;
    }

    .close {
      position: absolute;

      left: 22px;
      top: 30px;
    }

    @media (max-width: 700px) {

      header {
        padding-left: 18px;
      }

      main {
        padding: 120px 22px 90px;
      }

      .contact-title {
        font-size: clamp(38px, 13vw, 64px);
        margin-bottom: 40px;
      }

      .contact-info {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <header>

    <button
      class="menu-button"
      id="openMenu"
    >
      MENU
    </button>

    <a
      href="index.html"
      aria-label="home"
      style="
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 1000;

        display: flex;
        align-items: center;
        justify-content: center;

        width: 56px;
        height: 56px;
      "
    >
      <img
        src="assets/Icons/peterwood.png"
        alt="home"
        style="
          display: block;
          width: 100%;
          height: 100%;
          object-fit: contain;
        "
      >
    </a>

  </header>


  <main>

    <div class="contact-box">

      <h1 class="contact-title">
        contact
      </h1>


      <div class="contact-info">

        <p>
          <span class="contact-label">
            general enquiries
          </span>

          <a href="mailto:ruben@curiouspeople.uk">
            ruben@curiouspeople.uk
          </a>
        </p>


        <p>
          <span class="contact-label">
            instagram
          </span>

          <a
            href="#"
            target="_blank"
            rel="https://www.instagram.com/curiouspeopleuk/"
          >
            @curiouspeopleuk
          </a>
        </p>


        <p>
          <span class="contact-label">
            based in
          </span>

          london, united kingdom
        </p>

      </div>

    </div>

  </main>


  <div class="bottom-left">
    SHORT FILM PRODUCTIONS IN LONDON
  </div>


  <aside
    class="menu-panel"
    id="menuPanel"
    aria-hidden="true"
  >

    <button
      class="close"
      id="closeMenu"
    >
      CLOSE
    </button>

    <nav>
      <a href="index.html">home</a>
      <a href="films.html">film(s)</a>
      <a href="about.html">about</a>
      <a href="contact.html">contact</a>
      <script type='text/javascript' src='https://storage.ko-fi.com/cdn/widget/Widget_2.js'></script><script type='text/javascript'>kofiwidget2.init('Support me on Ko-fi', '#72a4f2', 'E5M728J3EX');kofiwidget2.draw();</script> 
    </nav>

  </aside>


  <script>

    const panel = document.getElementById('menuPanel');

    document
      .getElementById('openMenu')
      .addEventListener('click', () => {

        panel.classList.add('open');
        panel.setAttribute('aria-hidden', 'false');

      });

    document
      .getElementById('closeMenu')
      .addEventListener('click', () => {

        panel.classList.remove('open');
        panel.setAttribute('aria-hidden', 'true');

      });

  </script>

</body>
</html>
