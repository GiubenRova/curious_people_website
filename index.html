<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curious People - Short Films</title>

  <link rel="icon" href="assets/Icons/favicon.svg" type="image/svg+xml">
  
  <style>
    :root {
      --bg: #dedede;
      --text: #171717;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Ubuntu, Helvetica, sans-serif;
      text-transform: lowercase;
    }

    .top-line {
      position: fixed;
      inset: 0 0 auto 0;
      height: 10px;
      background: linear-gradient(
        90deg,
        #833AB4 0%,
        #FD1D1D 50%,
        #FCB045 100%
      );
      z-index: 10;
    }

    header {
      position: fixed;
      left: 0;
      top: 10px;
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      z-index: 5;
    }

    .menu-button,
    .close {
      appearance: none;
      border: 0;
      background: none;
      color: inherit;
      font: 700 11px/1 Ubuntu, Helvetica, sans-serif;
      cursor: pointer;
      text-transform: lowercase;
      padding: 10px 0;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 80px 24px;
    }

    /*
      LOGO:
      Sostituisci semplicemente "assets/logo.png" con il tuo PNG.
      Il PNG viene mantenuto come immagine, senza testo HTML.
    */
    .logo {
      display: block;
      width: min(58vw, 900px);
      max-height: 42vh;
      object-fit: contain;
      object-position: center;
      user-select: none;
    }

    .bottom-left,
    .bottom-right {
      position: fixed;
      bottom: 18px;
      font-size: 10px;
      font-weight: 700;
      z-index: 5;
    }

    .bottom-left { left: 18px; }
    .bottom-right { right: 18px; }

    .menu-panel {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      padding: 10vw;
      transform: translateX(-100%);
      transition: transform .45s cubic-bezier(.77,0,.18,1);
      z-index: 20;
    }

    .menu-panel.open { transform: translateX(0); }

    .menu-panel nav {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .menu-panel a {
      color: var(--text);
      text-decoration: none;
      font-size: clamp(32px, 5vw, 72px);
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .close {
      position: absolute;
      left: 22px;
      top: 30px;
    }

    @media (max-width: 700px) {
      .logo {
        width: min(82vw, 600px);
        max-height: 30vh;
      }

      .bottom-right { display: none; }
      header { padding-left: 18px; }
    }
  </style>
</head>

<body>
  <div class="top-line"></div>

  <header>
    <button class="menu-button" id="openMenu">MENU</button>
  </header>

  <main>
    <img
      class="logo"
      src="assets/logo.png"
      alt="Logo Curious People"
    >
  </main>

  <div class="bottom-left">SHORT FILM PRODUCTIONS IN LONDON</div>

  <aside class="menu-panel" id="menuPanel" aria-hidden="true">
    <button class="close" id="closeMenu">CLOSE</button>
    <nav>
      <a href="index.html">home</a>
      <a href="films.html">film(s)</a>
      <a href="about.html">about</a>
      <a href="contact.html">contact</a>
    </nav>
  </aside>

  <script>
    const panel = document.getElementById('menuPanel');

    document.getElementById('openMenu').addEventListener('click', () => {
      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
    });

    document.getElementById('closeMenu').addEventListener('click', () => {
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
    });
  </script>
</body>
</html>
